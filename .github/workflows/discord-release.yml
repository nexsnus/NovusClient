name: Discord Release Notes

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          webhook = os.environ["DISCORD_WEBHOOK"]
          name = os.environ.get("RELEASE_NAME") or "Manueller Test"
          tag = os.environ.get("RELEASE_TAG") or "Manueller Test"
          body = os.environ.get("RELEASE_BODY") or "Keine Release Notes vorhanden."

          embed = {
              "title": "Ein neues Novus Client Update ist da!"[:256],
              "description": body[:4000],
              "color": 5793266,
              "fields": [
                  {
                      "name": "Version",
                      "value": f"`{tag[:200]}`",
                      "inline": True
                  }
              ],
              "footer": {
                  "text": "Es gibt eine neue Novus Client Version"
              }
          }

          payload = {
              "embeds": [embed]
          }

          request = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "NovusClientReleaseBot/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print("Discord response:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord HTTP error:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
