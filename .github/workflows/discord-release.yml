name: Discord Release Notes

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest

    steps:
      - name: Send release to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          name = os.environ.get("RELEASE_NAME") or os.environ.get("RELEASE_TAG") or "Manueller Test"
          tag = os.environ.get("RELEASE_TAG") or "Manueller Test"
          body = os.environ.get("RELEASE_BODY") or "Keine Release Notes vorhanden."
          url = os.environ["DISCORD_WEBHOOK"]

          message = {
              "embeds": [{
                  "title": name,
                  "description": body[:4000],
                  "color": 5793266,
                  "fields": [{
                      "name": "Version",
                      "value": f"`{tag}`",
                      "inline": True
                  }],
                  "footer": {
                      "text": "Es gibt eine neue Novus Client Version"
                  }
              }]
          }

          webhook = os.environ.get("DISCORD_WEBHOOK")
          if not webhook:
              raise RuntimeError("DISCORD_WEBHOOK Secret fehlt.")

          request = urllib.request.Request(
              webhook,
              data=json.dumps(message).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=15) as response:
                  print("Discord response:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord HTTP error:", error.code)
              print(error.read().decode("utf-8", errors="replace"))
              raise
          PY
